# Path: pyproject.toml
# Purpose: Build configuration for pip-installable AetherVault package with CLI entry point.

[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aethervault-py"
version = "6.9.1"
description = "A secure, local-first password manager with AES-256 encryption"
authors = [
    {name = "AetherVault Team"},
]
license = {text = "GPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
# The desktop GUI needs Qt. Install with: pip install "aethervault-py[gui]"
# The core SDK/CLI (aethervault.sdk, aethervault.cli) is headless and does NOT need PySide6,
# so the package installs cleanly on Termux/Android and servers.
gui = ["PySide6>=6.5.0"]
# Docs tooling: renders USER_GUIDE.md -> USER_GUIDE.html (tools/build_user_guide.py).
docs = ["markdown>=3.4"]
# Test tooling: pytest + the FastAPI relay deps (sync integration tests start the relay).
test = ["pytest>=7", "fastapi>=0.110", "uvicorn[standard]>=0.27"]

[project.scripts]
aethervault = "aethervault.__main__:run"
aethervault-cli = "aethervault.cli:run"

[tool.setuptools.packages.find]
include = ["aethervault*"]

[tool.setuptools.package-data]
"aethervault" = [
    "assets/*.ico",
    "assets/*.png",
    "docs/*.md",
    "docs/*.html",
]
