name: Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: false
        default: "dev"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: aethervault-linux-x86_64
            asset_name: aethervault-linux-x86_64
          - os: windows-latest
            artifact_name: aethervault-windows-x86_64
            asset_name: aethervault-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxkbcommon-x11-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller aethervault.spec

      - name: Prepare release asset
        shell: bash
        run: mv dist/aethervault* ${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .app with PyInstaller
        run: pyinstaller --noconfirm aethervault-mac.spec

      - name: Ad-hoc codesign (required on Apple Silicon)
        run: codesign --force --deep --sign - dist/AetherVault.app

      - name: Verify codesign
        run: codesign --verify --verbose=2 dist/AetherVault.app

      - name: Smoke-test bundled binary
        run: dist/AetherVault.app/Contents/MacOS/aethervault --version

      - name: Create .app.zip
        run: ditto -c -k --keepParent dist/AetherVault.app dist/AetherVault-${{ matrix.arch }}.app.zip

      - name: Create DMG
        run: |
          # Build the DMG from a staging dir (app + /Applications symlink). The
          # staging dir avoids hdiutil "Resource busy" flakiness seen with
          # -srcfolder when the volume is still settling. Retry a few times in
          # case hdiutil transiently fails on shared runners.
          mkdir -p dmg-staging
          cp -R dist/AetherVault.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          for i in 1 2 3; do
            if hdiutil create -volname AetherVault \
                -srcfolder dmg-staging \
                -ov -format UDZO \
                dist/AetherVault-${{ matrix.arch }}.dmg; then
              exit 0
            fi
            echo "hdiutil attempt $i failed, retrying..."
            sleep 5
          done
          exit 1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aethervault-macos-${{ matrix.arch }}
          path: |
            dist/AetherVault-${{ matrix.arch }}.app.zip
            dist/AetherVault-${{ matrix.arch }}.dmg
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AetherVault-${{ matrix.arch }}.app.zip
            dist/AetherVault-${{ matrix.arch }}.dmg
