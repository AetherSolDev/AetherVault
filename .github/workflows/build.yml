name: Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: false
        default: "dev"

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: aetherlock-windows-x86_64
            separator: ";"
          - os: macos-latest
            artifact_name: aetherlock-macos-universal
            separator: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: >
          pyinstaller --onefile --windowed
          --name aetherlock
          --icon assets/aetherlock.ico
          --add-data "assets${{ matrix.separator }}assets"
          --add-data "docs${{ matrix.separator }}docs"
          --add-data "README.md${{ matrix.separator }}."
          --add-data "LICENSE${{ matrix.separator }}."
          src/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/aetherlock*
          if-no-files-found: error
