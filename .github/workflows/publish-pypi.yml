# Path: .github/workflows/publish-pypi.yml
# Purpose: Build and publish AetherVault to PyPI via trusted publishing on version tags.

name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Sync version with git tag
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: python - "$TAG" "$REF_TYPE" <<'EOF'
import os, re, sys
from pathlib import Path
tag, ref_type = sys.argv[1], sys.argv[2]
if ref_type == "tag":
    version = tag.lstrip("v")
    p = Path("pyproject.toml")
    text = p.read_text()
    text = re.sub(r'^version\s*=\s*"[^"]+"', f'version = "{version}"', text,
                  count=1, flags=re.M)
    p.write_text(text)
    print(f"Set version to {version}")
else:
    print("Manual dispatch — using committed version:")
    for line in Path("pyproject.toml").read_text().splitlines():
        if line.startswith("version"):
            print(" ", line)
EOF

      - name: Build package
        run: python -m build

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
