# Last Edited: 2026-08-05 17:34 CT (America/Chicago)
# Path: .github/workflows/publish-pypi.yml
# Purpose: Build and publish AetherVault to PyPI via trusted publishing on version tags.

name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Sync version with git tag
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            python -c "import re; p='pyproject.toml'; t=open(p).read(); t=re.sub(r'^version\s*=\s*\"[^\"]+\"', 'version = \"${TAG#v}\"', t, count=1, flags=re.M); open(p,'w').write(t); print('Set version to ${TAG#v}')"
          else
            echo "Manual dispatch — using committed version:"
            grep '^version' pyproject.toml
          fi

      - name: Build package
        run: python -m build

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
