# Path: .github/workflows/publish-pypi.yml
# Purpose: Build and publish AetherVault to PyPI via trusted publishing on version tags.

name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Sync version with git tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "Tag version: ${TAG#v}"
          python - <<'EOF'
          import os, re
          from pathlib import Path
          tag = os.environ["TAG"].lstrip("v")
          p = Path("pyproject.toml")
          text = p.read_text()
          text = re.sub(
              r'^version\s*=\s*"[^"]+"',
              f'version = "{tag}"',
              text,
              count=1,
              flags=re.M,
          )
          p.write_text(text)
          print(f"Set version to {tag}")
          EOF

      - name: Build package
        run: python -m build

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
